name: swarmproof CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run unittest suite (stdlib only, no API calls)
        run: python -m unittest discover -s tests -v

  dry-run-demo:
    name: Dry-run demo + pack verify
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dry-run fix (no model calls)
        run: |
          python -m swarmproof --version
          python -m swarmproof fix examples/fixture \
            --oracle "python -m unittest discover -s tests -v" \
            --out /tmp/swarmproof-ci-pack --dry-run --json
      - name: Verify the produced pack
        run: python -m swarmproof verify /tmp/swarmproof-ci-pack
      - name: Check shasum-compatible manifest
        run: cd /tmp/swarmproof-ci-pack && shasum -a 256 -c manifest.sha256

  build-wheel:
    name: Build wheel + install check
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build hatchling
          python -m build --wheel --outdir dist
      - name: Install wheel and check console script
        run: |
          python -m venv /tmp/spvenv
          /tmp/spvenv/bin/pip install dist/*.whl
          /tmp/spvenv/bin/swarmproof --version
          /tmp/spvenv/bin/swarmproof fix --help >/dev/null
