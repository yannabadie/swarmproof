[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmproof"
version = "0.2.1"
description = "v0.2 — Le swarm propose, l'oracle externe décide, l'Evidence Pack le prouve — CLI de remédiation vérifiée pour dépôts de code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yann Abadie" }]
keywords = ["hybrid-swarm", "oracle", "evidence-pack", "verified-remediation", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
swarmproof = "swarmproof.cli:main"

[project.urls]
Homepage = "https://github.com/yannabadie/swarmproof"
Repository = "https://github.com/yannabadie/swarmproof"

[tool.hatch.build.targets.wheel]
packages = ["swarmproof"]
